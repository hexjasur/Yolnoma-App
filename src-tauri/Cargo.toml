# ============================================
# Yolnoma App: Desktop Ultimate Utility App
# Author: Jasurbek Haydarov CEO @ JK Software
# Backend: Rust + Tauri v2
# ============================================


[package]
name = "yolnoma-app"
version = "1.0.1"
description = "Yolnoma Desktop Utility App"
authors = ["Jasurbek Haydarov"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yolnoma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.30"
regex = "1"
steamlocate = "2"
dirs = "6.0.0"
base64 = "0.22"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "webp", "gif", "ico", "tiff"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
sevenz-rust = "0.6"
# ── Crypto (account-specific storage) ──
aes-gcm  = "0.10"
hkdf     = "0.12"
sha2     = "0.10"
rand     = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
codegen-units = 1
