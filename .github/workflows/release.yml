name: Release Yolnoma

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================================
  # Job 1: Build & Sign Tauri Windows Application + Create Private Release
  # ============================================================================
  build:
    name: Build & Release Tauri App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend build secrets
        shell: pwsh
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          VITE_ABC_KEY: ${{ secrets.VITE_ABC_KEY }}
          VITE_REMOVE_BG_API_KEY: ${{ secrets.VITE_REMOVE_BG_API_KEY }}
          VITE_IMGBB_API_KEY: ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
        run: |
          $required = @(
            "STEAM_API_KEY",
            "VITE_ABC_KEY",
            "VITE_REMOVE_BG_API_KEY",
            "VITE_IMGBB_API_KEY",
            "VITE_FORMSPREE_ID"
          )

          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_").Value) })
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', '). Add them in Settings > Secrets and variables > Actions."
          }

      - name: Build and Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          VITE_ABC_KEY: ${{ secrets.VITE_ABC_KEY }}
          VITE_REMOVE_BG_API_KEY: ${{ secrets.VITE_REMOVE_BG_API_KEY }}
          VITE_IMGBB_API_KEY: ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Yolnoma v__VERSION__"
          releaseBody: |
            ## Yolnoma v__VERSION__

            Bug fixes and improvements.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false

      # ------------------------------------------------------------------------
      # Validate: actual built NSIS installer artifact version matches the Git tag
      # Prevents the infinite-updater-loop failure (e.g. tag v0.9.102 on 0.9.101 artifact)
      # This step inspects the actual generated installer output before any artifact
      # is uploaded so release publication cannot proceed on a mismatch.
      # ------------------------------------------------------------------------
      - name: Validate built installer matches Git tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          $expectedVersion = $tag -replace "^v", ""

          Write-Host "Git release tag  : $tag"
          Write-Host "Expected version : $expectedVersion"

          # 1. Locate the generated NSIS installer from the build outputs
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exe) {
            Write-Host "Checking all bundle directories for setup.exe..."
            $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*setup.exe" -Recurse | Select-Object -First 1
          }

          if (-not $exe) {
            Write-Host "::error::NSIS setup.exe installer was not found in build outputs."
            exit 1
          }

          Write-Host "Found generated installer: $($exe.Name)"

          # 2. Extract the actual version from the generated installer artifact filename
          # Tauri NSIS naming: <productName>_<version>_<arch>-setup.exe (e.g., Yolnoma_0.9.102_x64-setup.exe)
          $artifactVersion = $null
          if ($exe.Name -match '_([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-[0-9A-Za-z.-]+)?)_') {
            $artifactVersion = $Matches[1]
          } elseif ($exe.Name -match '^.*?_(?<ver>[^_]+)_.*-setup\.exe$') {
            $artifactVersion = $Matches.ver
          }

          # 3. Read PE binary VersionInfo if available on Windows
          $peVersion = $null
          try {
            $verInfo = (Get-Item $exe.FullName).VersionInfo
            if ($verInfo.ProductVersion) {
              $peVersion = $verInfo.ProductVersion.Trim()
            } elseif ($verInfo.FileVersion) {
              $peVersion = $verInfo.FileVersion.Trim()
            }
          } catch {
            Write-Host "Could not read PE VersionInfo: $($_.Exception.Message)"
          }

          # 4. Also read source config version for verification
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $configVersion = $tauriConf.version

          Write-Host "----------------------------------------"
          Write-Host "Expected Tag Version     : $expectedVersion"
          Write-Host "Installer File Name      : $($exe.Name)"
          Write-Host "Installer Version String : $artifactVersion"
          if ($peVersion) {
            Write-Host "PE Binary VersionInfo    : $peVersion"
          }
          Write-Host "tauri.conf.json Version  : $configVersion"
          Write-Host "----------------------------------------"

          # 5. Validate that the actual build output matches the release tag version
          $mismatch = $false
          if (-not $artifactVersion -or $artifactVersion -ne $expectedVersion) {
            $mismatch = $true
          }

          if ($mismatch) {
            Write-Host ""
            Write-Host "::error::Release version mismatch!"
            Write-Host "::error::Git tag                  : $tag"
            Write-Host "::error::Expected version         : $expectedVersion"
            Write-Host "::error::Generated installer file : $($exe.Name)"
            Write-Host "::error::Installer output version : $artifactVersion"
            Write-Host "::error::Source config version    : $configVersion"
            Write-Host "::error::Release was stopped to prevent publishing a broken updater."
            Write-Host ""
            Write-Host "Fix: Bump the version in src-tauri/tauri.conf.json and src-tauri/Cargo.toml"
            Write-Host "     to match Git tag '$tag' before releasing."
            exit 1
          }

          Write-Host "Artifact version validation passed: $($exe.Name) corresponds to Git tag $tag ✓"

      # ------------------------------------------------------------------------
      # Prepare & Validate NSIS Updater Files for Public Distribution
      # ------------------------------------------------------------------------
      - name: Prepare updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          Write-Host "Searching for NSIS installer in $nsisDir..."

          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exe) {
            Write-Host "Checking all bundle directories for setup.exe..."
            $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*setup.exe" -Recurse | Select-Object -First 1
          }

          if (-not $exe) {
            throw "NSIS setup.exe installer not found in build outputs."
          }

          $sig = Get-Item "$($exe.FullName).sig" -ErrorAction SilentlyContinue

          if (-not $sig) {
            $sig = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "$($exe.Name).sig" -Recurse | Select-Object -First 1
          }

          if (-not $sig) {
            throw "Signature file ($($exe.Name).sig) not found in build outputs."
          }

          Write-Host "Found installer: $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "Found signature: $($sig.FullName) ($($sig.Length) bytes)"

          New-Item -ItemType Directory -Force -Path "updater-artifacts" | Out-Null

          Copy-Item $exe.FullName "updater-artifacts/$($exe.Name)" -Force
          Copy-Item $sig.FullName "updater-artifacts/$($sig.Name)" -Force

      # ------------------------------------------------------------------------
      # Upload artifacts so Job 2 (or manual retries) can use them without rebuilding
      # ------------------------------------------------------------------------
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-artifacts
          path: updater-artifacts/
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Job 2: Attach updater artifacts directly to the GitHub Release.
  # No separate updates branch is needed; GitHub retains release assets.
  # Independent job: If publishing fails, retrying will NOT rebuild Tauri app.
  # ============================================================================
  publish-release-assets:
    name: Publish Updater Assets to GitHub Release
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: updater-artifacts
          path: updater-files

      - name: Generate Release Notes and Upload Release Assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Locate downloaded artifacts
          $exe = Get-ChildItem -Path "updater-files" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Installer .exe not found in downloaded artifacts."
          }

          $sig = Get-ChildItem -Path "updater-files" -Filter "$($exe.Name).sig" | Select-Object -First 1
          if (-not $sig) {
            $sig = Get-ChildItem -Path "updater-files" -Filter "*.sig" | Select-Object -First 1
          }

          if (-not $sig) {
            throw "Signature file ($($exe.Name).sig) not found in downloaded artifacts."
          }

          Write-Host "Installer file: $($exe.Name) ($($exe.Length) bytes)"
          Write-Host "Signature file: $($sig.Name) ($($sig.Length) bytes)"

          # 2. Extract signature content
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Signature content is empty!"
          }

          # 3. Format release version (e.g. v0.9.53 -> 0.9.53)
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace "^v", ""
          Write-Host "Releasing version: $version (Git tag: $tag)"

          # ----------------------------------------------------------------
          # 4. Automatic release notes from Git commit history
          # ----------------------------------------------------------------

          # Find the previous release tag (the tag immediately before $tag)
          $allTags = git tag --sort=-version:refname 2>$null
          $prevTag = $null
          $foundCurrent = $false
          foreach ($t in $allTags) {
            if ($t -eq $tag) {
              $foundCurrent = $true
              continue
            }
            if ($foundCurrent) {
              $prevTag = $t
              break
            }
          }

          if ($prevTag) {
            Write-Host "Previous release tag: $prevTag — comparing $prevTag..$tag"
            $range = "$prevTag..$tag"
          } else {
            Write-Host "No previous tag found. Using all commits up to $tag"
            $range = $tag
          }

          # Get one-line commit messages in the range
          $rawCommits = git log $range --pretty=format:"%s" 2>$null

          # Conventional Commit type -> emoji section mapping
          $typeMap = [ordered]@{
            "feat"     = "✨ What's New"
            "fix"      = "🐛 Bug Fixes"
            "perf"     = "⚡ Performance"
            "refactor" = "🔧 Improvements"
            "docs"     = "📚 Documentation"
            "chore"    = "🔧 Maintenance"
          }

          # Collect entries per section
          $sections = [ordered]@{}
          foreach ($key in $typeMap.Keys) { $sections[$key] = [System.Collections.Generic.List[string]]::new() }

          # Regex that matches any supported type prefix (with optional scope)
          $prefixPattern = '(?i)\b(feat|fix|perf|refactor|docs|chore)(\([^)]*\))?:\s*'

          foreach ($msg in $rawCommits) {
            if ([string]::IsNullOrWhiteSpace($msg)) { continue }

            # Skip merge commits
            if ($msg -match '^Merge ') { continue }

            # Split the commit message on every occurrence of a type prefix.
            # Strategy: find all match positions, then slice text between them.
            $matches_ = [regex]::Matches($msg, $prefixPattern)

            if ($matches_.Count -eq 0) { continue }   # no recognized prefix — skip

            for ($i = 0; $i -lt $matches_.Count; $i++) {
              $m        = $matches_[$i]
              $type     = $m.Groups[1].Value.ToLower()

              # Text starts right after this prefix
              $textStart = $m.Index + $m.Length

              # Text ends just before the next prefix (or at end of string)
              if ($i + 1 -lt $matches_.Count) {
                $textEnd = $matches_[$i + 1].Index
              } else {
                $textEnd = $msg.Length
              }

              $text = $msg.Substring($textStart, $textEnd - $textStart).Trim()

              if ([string]::IsNullOrWhiteSpace($text)) { continue }

              # Capitalize first letter
              $text = $text.Substring(0,1).ToUpper() + $text.Substring(1)

              if ($sections.Contains($type)) {
                $sections[$type].Add($text)
              }
            }
          }

          # Build the human-readable release notes string
          $noteLines = [System.Collections.Generic.List[string]]::new()

          foreach ($type in $typeMap.Keys) {
            $entries = $sections[$type]
            if ($entries.Count -eq 0) { continue }

            $noteLines.Add($typeMap[$type])
            $noteLines.Add("")
            foreach ($entry in $entries) {
              $noteLines.Add("• $entry")
            }
            $noteLines.Add("")
          }

          # Trim trailing blank line
          while ($noteLines.Count -gt 0 -and $noteLines[$noteLines.Count - 1] -eq "") {
            $noteLines.RemoveAt($noteLines.Count - 1)
          }

          if ($noteLines.Count -eq 0) {
            $releaseNotes = "Bug fixes and improvements."
          } else {
            $releaseNotes = $noteLines -join "`n"
          }

          Write-Host "--- Generated Release Notes ---"
          Write-Host $releaseNotes
          Write-Host "-------------------------------"

          # ----------------------------------------------------------------
          # 5. Construct latest.json according to Tauri 2 updater manifest schema
          # ----------------------------------------------------------------
          $repoSlug = "${{ github.repository }}"
          $releaseUrl = "https://github.com/$repoSlug/releases/download/$tag"

          $manifest = [ordered]@{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "$releaseUrl/$($exe.Name)"
              }
            }
          }

          $latestJsonPath = "updater-files/latest.json"
          $jsonContent = $manifest | ConvertTo-Json -Depth 10
          Set-Content -Path $latestJsonPath -Value $jsonContent -Encoding utf8

          Write-Host "Generated latest.json:"
          Write-Host $jsonContent

          # 6. Upload the manifest and updater assets directly to this release.
          gh release upload $tag `
            "updater-files/$($exe.Name)" `
            "updater-files/$($sig.Name)" `
            "updater-files/latest.json" `
            --repo $repoSlug `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload updater assets to release $tag."
          }

          # Backward compatibility: v1.0.15 and older builds use the former
          # updates-branch endpoint. Keep its manifest pointing at the newest
          # release so those installed clients can migrate to release assets.
          $legacyManifest = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($jsonContent))
          $legacySha = gh api "repos/$repoSlug/contents/latest.json?ref=updates" --jq ".sha"
          if ($LASTEXITCODE -eq 0 -and $legacySha) {
            $payload = @{ message = "chore: sync legacy updater manifest to $tag"; content = $legacyManifest; sha = $legacySha; branch = "updates" } | ConvertTo-Json -Compress
            $payload | gh api --method PUT "repos/$repoSlug/contents/latest.json" --input - | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to synchronize the legacy updates manifest." }
            Write-Host "Synchronized legacy updates manifest to $tag."
          } else {
            Write-Host "Legacy updates branch not found; skipping compatibility sync."
          }

          Write-Host "Successfully published updater assets to GitHub Release $tag!"
