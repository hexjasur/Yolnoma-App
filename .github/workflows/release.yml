name: Release Yolnoma

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: v__VERSION__
          releaseName: "Yolnoma v__VERSION__"
          releaseBody: |
            ## Yolnoma v__VERSION__

            Bug fixes and improvements.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false

      # -----------------------------------
      # Prepare NSIS updater files
      # -----------------------------------

      - name: Prepare updater files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsisDir = "src-tauri/target/release/bundle/nsis"

          $exe = Get-ChildItem $nsisDir -Filter "*-setup.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "NSIS setup.exe not found"
          }

          $sig = Get-Item "$($exe.FullName).sig"

          if (-not $sig) {
            throw "NSIS signature file not found"
          }

          Write-Host "Updater EXE: $($exe.FullName)"
          Write-Host "Updater SIG: $($sig.FullName)"

          New-Item -ItemType Directory -Force -Path "updater-files" | Out-Null

          Copy-Item $exe.FullName "updater-files/$($exe.Name)"
          Copy-Item $sig.FullName "updater-files/$($sig.Name)"

          "UPDATER_EXE=$($exe.Name)" | Out-File $env:GITHUB_ENV -Append
          "UPDATER_SIG=$($sig.Name)" | Out-File $env:GITHUB_ENV -Append

      # -----------------------------------
      # Create latest.json automatically
      # -----------------------------------

      - name: Create latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}"
          $version = $version -replace "^v", ""

          $signature = Get-Content "updater-files/$env:UPDATER_SIG" -Raw

          $baseUrl = "https://raw.githubusercontent.com/Yolnoma/Yolnoma-Updates/main"

          $manifest = @{
            version = $version
            notes = "Bug fixes and improvements."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "$baseUrl/$env:UPDATER_EXE"
              }
            }
          }

          $manifest |
            ConvertTo-Json -Depth 10 |
            Set-Content "updater-files/latest.json" -Encoding utf8

          Write-Host "Generated latest.json:"
          Get-Content "updater-files/latest.json"

      # -----------------------------------
      # Push updater files to public repo
      # -----------------------------------

      - name: Publish updater files
        shell: pwsh
        env:
          UPDATES_REPO_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $baseUrl = "https://raw.githubusercontent.com/Yolnoma/Yolnoma-Updates/main"

          Write-Host "Cloning $repo..."

          git clone "https://x-access-token:$env:UPDATES_REPO_TOKEN@github.com/$repo.git" updates

          Write-Host "Copying updater files..."

          Copy-Item "updater-files/$env:UPDATER_EXE" "updates/$env:UPDATER_EXE" -Force
          Copy-Item "updater-files/$env:UPDATER_SIG" "updates/$env:UPDATER_SIG" -Force
          Copy-Item "updater-files/latest.json" "updates/latest.json" -Force

          Set-Location updates

          git config user.name "Yolnoma Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "release: v${{ github.ref_name }}"

          git push origin main